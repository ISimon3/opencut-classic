[package]
name = "opencut-tauri"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
rfd = { version = "0.15", default-features = false }
dunce = "1"
tauri-plugin-opener = "2"

[workspace]

[profile.release]
strip = true
lto = true
codegen-units = 1
